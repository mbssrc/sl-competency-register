<div class="rounded-md p-3 {% if success %}bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800{% else %}bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800{% endif %}">
  <div class="flex items-center mb-1">
    {% if success %}
    <svg class="w-4 h-4 text-green-600 dark:text-green-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    <span class="text-sm font-medium text-green-800 dark:text-green-300">{{ action }} completed</span>
    {% else %}
    <svg class="w-4 h-4 text-red-600 dark:text-red-400 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    <span class="text-sm font-medium text-red-800 dark:text-red-300">{{ action }} failed</span>
    {% endif %}
  </div>
  <pre class="mt-2 text-xs font-mono whitespace-pre-wrap {% if success %}text-green-700 dark:text-green-300{% else %}text-red-700 dark:text-red-300{% endif %}">{{ output }}</pre>
</div>
