<div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-white/10 p-6">
  <div class="flex items-center justify-between mb-6">
    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Add Skill — {{ person.name }}</h3>
    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  {% if errors %}
  <div class="mb-4 p-3 rounded-md bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/50">
    <ul class="text-sm text-red-700 dark:text-red-400 space-y-1">
      {% for error in errors %}
      <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <form method="post"
        action="{% url 'personnel:person-skill-add' person.id %}"
        class="space-y-5">
    {% csrf_token %}

    <div>
      <label for="id_skill" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Skill</label>
      <div x-data="combobox" class="relative">
        <select name="skill_id" id="id_skill" required
                class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
          <option value="">-- Select a skill --</option>
          {% regroup available_skills by domain.name as domain_groups %}
          {% for group in domain_groups %}
          <optgroup label="{{ group.grouper }}">
            {% for skill in group.list %}
            <option value="{{ skill.id }}" data-search="{{ skill.category }}|{{ skill.tags|join:'|' }}" {% if form_data.skill_id == skill.id %}selected{% endif %}>
              {{ skill.name }}
            </option>
            {% endfor %}
          </optgroup>
          {% endfor %}
        </select>
        {% include "core/partials/combobox.html" with placeholder="Search skills by name, tag, domain or ID…" %}
      </div>
    </div>

    <div>
      <label for="id_level" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Proficiency Level</label>
      <select name="level" id="id_level"
              class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        <option value="0" {% if form_data.level == "0" %}selected{% endif %}>0 — None</option>
        <option value="1" {% if form_data.level == "1" %}selected{% endif %}>1 — Awareness</option>
        <option value="2" {% if form_data.level == "2" %}selected{% endif %}>2 — Guided</option>
        <option value="3" {% if form_data.level == "3" %}selected{% endif %}>3 — Independent</option>
        <option value="4" {% if form_data.level == "4" %}selected{% endif %}>4 — Expert</option>
        <option value="5" {% if form_data.level == "5" %}selected{% endif %}>5 — Authority</option>
      </select>
    </div>

    <div>
      <label for="id_assessed_date" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Assessed Date</label>
      <input type="date" name="assessed_date" id="id_assessed_date" required
             value="{{ form_data.assessed_date|default:'' }}"
             class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
    </div>

    <div>
      <label for="id_evidence" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        Evidence Notes <span class="font-normal text-gray-500">(optional)</span>
      </label>
      <textarea name="evidence_notes" id="id_evidence" rows="3"
                class="w-full px-3 py-2 rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                placeholder="Training completed, certification obtained, etc.">{{ form_data.evidence_notes|default:'' }}</textarea>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-white/10">
      <button type="button" onclick="closeModal()"
              class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-white/5 border border-gray-300 dark:border-white/10 rounded-md hover:bg-gray-50 dark:hover:bg-white/10 transition-colors">
        Cancel
      </button>
      <button type="submit"
              class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Add Skill
      </button>
    </div>
  </form>
</div>
