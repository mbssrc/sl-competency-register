<tr id="skill-row-{{ person_skill.skill_id }}" class="border-b border-gray-100 dark:border-white/5 last:border-b-0 bg-indigo-50/50 dark:bg-indigo-900/10">
  <td class="px-4 py-2.5 font-mono text-xs text-gray-600 dark:text-gray-400">
    {{ person_skill.skill_id }}
  </td>
  <td class="px-4 py-2.5 text-gray-900 dark:text-gray-200">
    {{ skill_name }}
  </td>
  <td class="px-4 py-3" colspan="6">
    <form hx-post="{% url 'personnel:person-skill-edit' person.id person_skill.skill_id %}"
          hx-target="#skill-row-{{ person_skill.skill_id }}"
          hx-swap="outerHTML"
          class="flex items-end gap-4 flex-wrap">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Level (0-5)</label>
        <input type="number" name="level" value="{{ person_skill.level }}" min="0" max="5"
               class="w-20 rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-gray-100 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-transparent">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Assessed Date</label>
        <input type="date" name="assessed_date" value="{{ person_skill.assessed_date|date:'Y-m-d' }}"
               class="rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-gray-100 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-transparent">
      </div>

      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Evidence Notes</label>
        <input type="text" name="evidence_notes" value="{{ person_skill.evidence_notes }}"
               class="w-full rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-gray-100 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-transparent"
               placeholder="Evidence notes...">
      </div>

      <div class="flex items-center gap-2">
        <button type="submit"
                class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 rounded-md transition-colors">
          Save
        </button>
        <button type="button"
                hx-get="{% url 'personnel:person-skill-edit' person.id person_skill.skill_id %}"
                hx-target="#skill-row-{{ person_skill.skill_id }}"
                hx-swap="outerHTML"
                hx-headers='{"X-Cancel": "true"}'
                class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-white/5 border border-gray-300 dark:border-white/10 rounded-md hover:bg-gray-50 dark:hover:bg-white/10 transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </td>
</tr>
