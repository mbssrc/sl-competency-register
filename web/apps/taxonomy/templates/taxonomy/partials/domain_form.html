<div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-white/10 p-6 max-h-[85vh] overflow-y-auto">
  <div class="flex items-center justify-between mb-6">
    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Edit Domain: {{ domain.name }}</h3>
    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="mb-4">
    <span class="font-mono text-xs bg-gray-100 dark:bg-white/5 text-gray-500 dark:text-gray-400 px-2 py-0.5 rounded">{{ domain.id }}</span>
  </div>

  <form method="post" action="{% url 'taxonomy:domain-edit' domain.id %}" class="space-y-5">
    {% csrf_token %}

    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
      <input type="text" id="name" name="name" value="{{ domain.name }}" required
             class="w-full rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-gray-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
      <textarea id="description" name="description" rows="3" required
                class="w-full rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-gray-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">{{ domain.description }}</textarea>
    </div>

    <div>
      <label for="note" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Note <span class="font-normal text-gray-500">(optional)</span></label>
      <textarea id="note" name="note" rows="2"
                class="w-full rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-gray-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">{{ domain.note }}</textarea>
    </div>

    <div>
      <label for="categories" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categories <span class="font-normal text-gray-500">(one per line, format: ID: Name)</span></label>
      <textarea id="categories" name="categories" rows="6"
                class="w-full rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 text-gray-900 dark:text-gray-100 px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">{{ cats_str }}</textarea>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-white/10">
      <button type="button" onclick="closeModal()"
              class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-white/5 border border-gray-300 dark:border-white/10 rounded-md hover:bg-gray-50 dark:hover:bg-white/10 transition-colors">
        Cancel
      </button>
      <button type="submit"
              class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Save Changes
      </button>
    </div>
  </form>
</div>
