# Ruff configuration, used by `nix fmt` (via nix/treefmt.nix) and directly.
#

line-length = 100          # p99 of the existing code is 99 characters
target-version = "py313"

exclude = [
  "web/apps/*/migrations",  # generated by Django
  ".demo-run",
]

[lint]
# Ruff's default set, plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Settings modules re-export under `import *` by design.
"web/config/settings_test.py" = ["F403", "F405"]

[format]
quote-style = "double"
